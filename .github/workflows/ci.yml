name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: worker lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker
        working-directory: apps/worker
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Ruff check
        working-directory: apps/worker
        run: python -m ruff check app
      - name: Type check
        working-directory: apps/worker
        run: python -m mypy app
      - name: Pytest
        working-directory: apps/worker
        env:
          MOCK_PROVIDERS: "true"
          BOT_DEFAULT_MODE: paper
        run: python -m pytest

  desktop:
    name: desktop lint, contracts, e2e, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run desktop:lint
      - name: Typecheck
        run: npm run desktop:typecheck
      - name: Test
        run: npm run desktop:test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run desktop:e2e
      - name: Build
        run: npm run desktop:build

  desktop-native:
    name: Tauri Rust check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Check Rust toolchain
        run: rustc --version && cargo --version
      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Cargo build
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked

  migrations:
    name: migration apply and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Test migration safety guards
        run: >-
          python -m unittest discover -s .github/scripts
          -p 'test_migration_safety_guards.py' -v
      - name: Block historical migration rewrites
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: >-
          python .github/scripts/migration_history_guard.py
          --base "$BASE_REVISION" --head "$HEAD_REVISION"
      - name: Check migration order and safety
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test "${#migrations[@]}" -gt 0
          phase="legacy"
          expected_prefix=1
          previous_timestamp=""
          for file in "${migrations[@]}"; do
            name="$(basename "$file")"
            if [[ "$name" =~ ^([0-9]{4})_[a-z0-9_]+\.sql$ ]]; then
              test "$phase" = "legacy"
              prefix="${BASH_REMATCH[1]}"
              printf -v expected "%04d" "$expected_prefix"
              test "$prefix" = "$expected"
              expected_prefix=$((expected_prefix + 1))
            elif [[ "$name" =~ ^([0-9]{14})_[a-z0-9_]+\.sql$ ]]; then
              phase="timestamp"
              timestamp="${BASH_REMATCH[1]}"
              if [[ -n "$previous_timestamp" ]]; then
                [[ "$previous_timestamp" < "$timestamp" ]]
              fi
              previous_timestamp="$timestamp"
            else
              echo "::error file=$file::Migration filename must use NNNN_name.sql or YYYYMMDDHHMMSS_name.sql"
              exit 1
            fi
          done
          for required in 0001_schema.sql 0002_rls.sql 0003_realtime.sql 0004_retention.sql 0005_schema_alignment.sql; do
            test -f "supabase/migrations/$required"
          done
      - name: Check RLS and public write safety
        run: python .github/scripts/repository_safety.py migrations
      - name: Apply G1+G2 migrations and assert contracts
        run: python supabase/verify_g1_g2_migration.py
      - name: Check singleton paper safety seed
        shell: python
        run: |
          import re
          from pathlib import Path

          seed = Path("supabase/seed.sql").read_text(encoding="utf-8")
          normalized = re.sub(r"\s+", " ", seed)
          assert "'singleton'" in normalized
          assert re.search(r"false,\s*'paper',\s*false", normalized)
  repository-safety:
    name: repository safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Block committed env files
        shell: bash
        run: |
          set -euo pipefail
          bad_env_files="$(
            git ls-files |
              awk '/(^|\/)\.env($|\.)/ && !/(^|\/)\.env\.example$/ { print }'
          )"
          if [[ -n "$bad_env_files" ]]; then
            echo "::error::Non-example .env files are tracked. Remove them from Git."
            printf '%s\n' "$bad_env_files"
            exit 1
          fi
      - name: Check workflow and deploy policy
        run: python .github/scripts/repository_safety.py workflows

  docs:
    name: docs basic checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Check required docs exist
        shell: bash
        run: |
          set -euo pipefail
          required_docs=(
            docs/G0_OPERATING_BOUNDARY.md
            docs/API_CONNECTIONS.md
            docs/API_GAPS.md
            docs/RISK_POLICY.md
            docs/THREAT_MODEL.md
            docs/CI_CD.md
            docs/SECURITY.md
            docs/RELEASE_PROCESS.md
            docs/ROLLBACK.md
            docs/GIT_RULES.md
          )
          for doc in "${required_docs[@]}"; do
            test -s "$doc"
          done
      - name: Check safety docs mention live guardrails
        shell: python
        run: |
          from pathlib import Path

          docs = "\n".join(
              Path(path).read_text(encoding="utf-8")
              for path in [
                  "docs/RELEASE_PROCESS.md",
                  "docs/ROLLBACK.md",
                  "docs/CI_CD.md",
              ]
          )
          assert "live_order_allowed=false" in docs or "live_order_allowed = false" in docs
          assert "manual" in docs.lower()
