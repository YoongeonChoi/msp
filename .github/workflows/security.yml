name: security

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "23 18 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  security-audits:
    name: Dependency gates and code audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install Node dependencies
        run: npm ci
      - name: npm audit gate
        run: npm audit --audit-level=moderate
      - name: Install Python audit tools
        run: "python -m pip install --force-reinstall --require-hashes --only-binary=:all: -r .github/security-tools.lock"
      - name: Verify Python security tool dependencies
        run: python -m pip check
      - name: Audit Python security tool dependencies
        run: python -m pip_audit -r .github/security-tools.lock
      - name: pip-audit gate
        working-directory: apps/worker
        run: python -m pip_audit -r requirements.lock
      - name: bandit gate
        working-directory: apps/worker
        run: python -m bandit -q -r app -x app/tests --severity-level medium

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-pattern-scan:
    name: Common secret pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Block committed env files
        shell: bash
        run: |
          set -euo pipefail
          bad_env_files="$(
            git ls-files |
              awk '/(^|\/)\.env($|\.)/ && !/(^|\/)\.env\.example$/ { print }'
          )"
          if [[ -n "$bad_env_files" ]]; then
            echo "::error::Non-example .env files are tracked. Remove them from Git."
            printf '%s\n' "$bad_env_files"
            exit 1
          fi
      - name: Scan tracked files for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          common_secret_files="$(
            git grep -I -l -E \
              '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH |PRIVATE )?PRIVATE KEY-----)' \
              -- ':!package-lock.json' ':!**/package-lock.json' ':!docs/API_CONNECTIONS.md' || true
          )"
          secret_assignment_files="$(
            git grep -I -l -E \
              "(SUPABASE_SECRET_KEY|TOSS_CLIENT_SECRET|OPENAI_API_KEY|NAVER_CLIENT_SECRET|KRX_API_KEY|OPENDART_API_KEY|ALERT_WEBHOOK_URL|RENDER_DEPLOY_HOOK_URL|SUPABASE_LIVE_REQUESTER_JWT|SUPABASE_LIVE_REVIEWER_JWT)[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9_./+=:-]{16,}" \
              -- ':!**/.env.example' ':!docs/**' || true
          )"
          findings="$(printf '%s\n%s\n' "$common_secret_files" "$secret_assignment_files" | awk 'NF' | sort -u)"
          if [[ -n "$findings" ]]; then
            echo "::error::Potential secret material found in tracked files. Only file paths are printed."
            printf '%s\n' "$findings"
            exit 1
          fi

  workflow-policy:
    name: Workflow policy guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Block unsafe workflow patterns
        run: python .github/scripts/repository_safety.py workflows
