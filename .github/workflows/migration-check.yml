name: migration-check

on:
  pull_request:
    paths:
      - "apps/worker/app/domain/market_data/point_in_time.py"
      - "apps/worker/app/domain/market_data/point_in_time_calendar.py"
      - "apps/worker/app/domain/market_data/daily_candle_timing.py"
      - "apps/worker/app/domain/market_data/daily_candle_as_of.py"
      - "apps/worker/app/domain/market_data/calendar_as_of.py"
      - "apps/worker/app/application/ports/daily_candle_as_of_reader_port.py"
      - "apps/worker/app/application/ports/calendar_observation_store_port.py"
      - "apps/worker/app/application/ports/calendar_as_of_reader_port.py"
      - "apps/worker/app/application/ports/kr_calendar_collection_job_store_port.py"
      - "apps/worker/app/application/ports/daily_candle_collection_job_store_port.py"
      - "apps/worker/app/adapters/persistence/supabase_daily_candle_as_of_reader.py"
      - "apps/worker/app/adapters/persistence/supabase_calendar_observation_store.py"
      - "apps/worker/app/adapters/persistence/supabase_calendar_as_of_reader.py"
      - "apps/worker/app/adapters/persistence/supabase_kr_calendar_collection_job_store.py"
      - "apps/worker/app/adapters/persistence/supabase_daily_candle_collection_job_store.py"
      - "supabase/migrations/**"
      - "supabase/preflight/**"
      - "supabase/config.toml"
      - "supabase/migration-checksums.v1.json"
      - "supabase/seed.sql"
      - "supabase/verify_g1_g2_migration.py"
      - "supabase/verify_pit_candle_revision_store.py"
      - "supabase/verify_pit_daily_candle_timing_store.py"
      - "supabase/verify_pit_source_observation_occurrence_store.py"
      - "supabase/verify_pit_daily_candle_as_of_reader.py"
      - "supabase/verify_pit_calendar_observation_store.py"
      - "supabase/verify_pit_calendar_as_of_reader.py"
      - "supabase/verify_kr_calendar_collection_job_store.py"
      - "supabase/verify_pit_daily_candle_collection_job_store.py"
      - ".github/scripts/repository_safety.py"
      - ".github/scripts/migration_history_guard.py"
      - ".github/scripts/test_migration_safety_guards.py"
      - ".github/rulesets/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/migration-check.yml"
  push:
    branches: [main, develop]
    paths:
      - "apps/worker/app/domain/market_data/point_in_time.py"
      - "apps/worker/app/domain/market_data/point_in_time_calendar.py"
      - "apps/worker/app/domain/market_data/daily_candle_timing.py"
      - "apps/worker/app/domain/market_data/daily_candle_as_of.py"
      - "apps/worker/app/domain/market_data/calendar_as_of.py"
      - "apps/worker/app/application/ports/daily_candle_as_of_reader_port.py"
      - "apps/worker/app/application/ports/calendar_observation_store_port.py"
      - "apps/worker/app/application/ports/calendar_as_of_reader_port.py"
      - "apps/worker/app/application/ports/kr_calendar_collection_job_store_port.py"
      - "apps/worker/app/application/ports/daily_candle_collection_job_store_port.py"
      - "apps/worker/app/adapters/persistence/supabase_daily_candle_as_of_reader.py"
      - "apps/worker/app/adapters/persistence/supabase_calendar_observation_store.py"
      - "apps/worker/app/adapters/persistence/supabase_calendar_as_of_reader.py"
      - "apps/worker/app/adapters/persistence/supabase_kr_calendar_collection_job_store.py"
      - "apps/worker/app/adapters/persistence/supabase_daily_candle_collection_job_store.py"
      - "supabase/migrations/**"
      - "supabase/preflight/**"
      - "supabase/config.toml"
      - "supabase/migration-checksums.v1.json"
      - "supabase/seed.sql"
      - "supabase/verify_g1_g2_migration.py"
      - "supabase/verify_pit_candle_revision_store.py"
      - "supabase/verify_pit_daily_candle_timing_store.py"
      - "supabase/verify_pit_source_observation_occurrence_store.py"
      - "supabase/verify_pit_daily_candle_as_of_reader.py"
      - "supabase/verify_pit_calendar_observation_store.py"
      - "supabase/verify_pit_calendar_as_of_reader.py"
      - "supabase/verify_kr_calendar_collection_job_store.py"
      - "supabase/verify_pit_daily_candle_collection_job_store.py"
      - ".github/scripts/repository_safety.py"
      - ".github/scripts/migration_history_guard.py"
      - ".github/scripts/test_migration_safety_guards.py"
      - ".github/rulesets/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/migration-check.yml"

permissions:
  contents: read

concurrency:
  group: migration-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-check:
    name: Supabase migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Test migration safety guards
        run: >-
          python -m unittest discover -s .github/scripts
          -p 'test_migration_safety_guards.py' -v
      - name: Block historical migration rewrites
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: >-
          python .github/scripts/migration_history_guard.py
          --base "$BASE_REVISION" --head "$HEAD_REVISION"
      - name: Block committed env files
        shell: bash
        run: |
          set -euo pipefail
          bad_env_files="$(
            git ls-files |
              awk '/(^|\/)\.env($|\.)/ && !/(^|\/)\.env\.example$/ { print }'
          )"
          if [[ -n "$bad_env_files" ]]; then
            echo "::error::Non-example .env files are tracked. Remove them from Git."
            printf '%s\n' "$bad_env_files"
            exit 1
          fi
      - name: Validate migration filenames and order
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test "${#migrations[@]}" -gt 0

          phase="legacy"
          expected_prefix=1
          previous_timestamp=""
          for file in "${migrations[@]}"; do
            name="$(basename "$file")"
            if [[ "$name" =~ ^([0-9]{4})_[a-z0-9_]+\.sql$ ]]; then
              test "$phase" = "legacy"
              prefix="${BASH_REMATCH[1]}"
              printf -v expected "%04d" "$expected_prefix"
              test "$prefix" = "$expected"
              expected_prefix=$((expected_prefix + 1))
            elif [[ "$name" =~ ^([0-9]{14})_[a-z0-9_]+\.sql$ ]]; then
              phase="timestamp"
              timestamp="${BASH_REMATCH[1]}"
              if [[ -n "$previous_timestamp" ]]; then
                [[ "$previous_timestamp" < "$timestamp" ]]
              fi
              previous_timestamp="$timestamp"
            else
              echo "::error file=$file::Migration filename must use NNNN_name.sql or YYYYMMDDHHMMSS_name.sql"
              exit 1
            fi
          done
      - name: Require RLS for public tables
        run: python .github/scripts/repository_safety.py migrations
      - name: Apply G1+G2 migrations and assert contracts
        run: python supabase/verify_g1_g2_migration.py
      - name: Verify PIT candle revision behavior
        run: python supabase/verify_pit_candle_revision_store.py
      - name: Verify PIT daily-candle timing evidence
        run: python supabase/verify_pit_daily_candle_timing_store.py
      - name: Verify PIT source observation occurrences
        run: python supabase/verify_pit_source_observation_occurrence_store.py
      - name: Verify durable PIT daily-candle as-of reader
        run: python supabase/verify_pit_daily_candle_as_of_reader.py
      - name: Verify independent PIT KR calendar observations
        run: python supabase/verify_pit_calendar_observation_store.py
      - name: Verify bounded PIT KR calendar as-of reader
        run: python supabase/verify_pit_calendar_as_of_reader.py
      - name: Verify durable KR calendar range collection jobs
        run: python supabase/verify_kr_calendar_collection_job_store.py
      - name: Verify durable PIT daily-candle collection jobs
        run: python supabase/verify_pit_daily_candle_collection_job_store.py
      - name: Check singleton paper safety seed
        shell: python
        run: |
          import re
          from pathlib import Path

          seed = Path("supabase/seed.sql").read_text(encoding="utf-8")
          normalized = re.sub(r"\s+", " ", seed)
          assert "'singleton'" in normalized
          assert re.search(r"false,\s*'paper',\s*false", normalized)
